var BG=null,BGD=null,bgT=null;
function bgFetch(){return api("settings?select=value&key=eq.bg").then(function(r){if(r&&r[0]){try{return JSON.parse(r[0].value)}catch(e){}}return null})}
function bgDefaults(){if(BGD)return Promise.resolve(BGD);return fetch("bg-default.json").then(function(r){return r.json()}).then(function(j){BGD=j;return j}).catch(function(){return[]})}
function bgStart(list){
  var box=$("bgs");box.innerHTML="";if(bgT){clearInterval(bgT);bgT=null}
  if(!list||!list.length)return;
  var cn=navigator.connection||{};if(cn.saveData)return;
  var els=list.map(function(u){var d=document.createElement("div");d.className="bl";box.appendChild(d);return d});
  var i=0,loaded=[];
  function show(n){els.forEach(function(e,k){e.classList.toggle("on",k==n)})}
  function pre(n,cb){if(loaded[n])return cb();var im=new Image();im.onload=function(){els[n].style.backgroundImage="url("+list[n]+")";loaded[n]=1;cb()};im.onerror=function(){loaded[n]=1;cb()};im.src=list[n]}
  pre(0,function(){show(0);if(list.length>1&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){pre(1,function(){});bgT=setInterval(function(){var n=(i+1)%list.length;pre(n,function(){i=n;show(n);pre((n+1)%list.length,function(){})})},8000)}});
}
function bgInit(){bgFetch().then(function(l){if(l)return l;return bgDefaults()}).then(function(l){BG=l;bgStart(l)}).catch(function(){})}
window.addEventListener("load",function(){setTimeout(bgInit,600)});
function bgRender(){$("bgl").innerHTML=(BG||[]).map(function(u,k){return '<div class="bi"><div class="t" style="background-image:url('+u+')"></div><div class="c"><button data-bu="'+k+'">▲</button><button data-bd="'+k+'">▼</button><button data-bx="'+k+'">✕</button></div></div>'}).join("")}
function bgSave(){return api("rpc/admin_set_setting",{pass:PASS,k:"bg",v:JSON.stringify(BG)}).then(function(){bgRender();bgStart(BG)}).catch(function(e){alert(e.message)})}
function bgLoadAdmin(){if(BG)return bgRender();bgFetch().then(function(l){return l||bgDefaults()}).then(function(l){BG=l.slice();bgRender()})}
function shrinkBg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(file)}
function bgAdd(files){files=[].slice.call(files);if(!files.length)return;if(!BG)BG=[];var go=function(){var f=files.shift();if(!f){bgSave();return}if(BG.length>=8){alert(T("bgmax"));bgSave();return}shrinkBg(f,function(u){BG.push(u);go()})};go()}

  bgSave()};
