function form(msg,val){var rc=codes();view(frame('<div class="lbl">'+Y("sub")+'</div><input id="tki" maxlength="9" autocomplete="off" placeholder="'+Y("ph")+'" value="'+(val||"")+'"><button type="button" class="send" id="tkg" style="width:100%;margin-top:8px;background:var(--g)">'+Y("go")+'</button>'+(msg?'<div style="color:#fbbf24;margin-top:8px;font-size:14px">'+msg+'</div>':'')+(rc.length?'<div class="lbl" style="margin-top:10px">'+Y("rec")+'</div>'+rc.map(function(c){return '<span class="tkch" data-c="'+c+'">'+c+'</span>'}).join(""):"")))}
function look(c){c=String(c||"").trim().toUpperCase();if(!/^SM-[A-Z0-9]{6}$/.test(c)){form(Y("nf"),c);return}
  fetch(SB+"/rest/v1/rpc/track_order",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({c:c,b:AIB})}).then(function(r){return r.json()}).then(function(o){
    if(o&&o.s=="limit"){form(Y("lim"),c);return}
    if(!o||!o.s){form(Y("nf"),c);return}
    var h='<div style="text-align:center;font-weight:800;letter-spacing:2px;color:#fbbf24;direction:ltr">'+c+'</div>';
    if(o.s=="cancelled")h+='<div style="text-align:center;font-size:20px;font-weight:800;color:#f87171;margin:12px 0">'+Y("s_cancelled")+'</div>';
    else{var n=steps.indexOf(o.s);h+='<div class="tkst">'+steps.map(function(s,i){return (i?'<b class="'+(i<=n?"on":"")+'"></b>':"")+'<i class="'+(i<=n?"on":"")+'">'+(i<=n?"✓":"")+'</i>'}).join("")+'</div><div class="tkl">'+steps.map(function(s,i){return '<span class="'+(i==n?"on":"")+'">'+Y("s_"+s)+'</span>'}).join("")+'</div>'}
    h+='<div style="margin-top:12px;border-top:1px solid #fff3;padding-top:8px">'+(o.items||[]).map(function(i){return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0"><span>'+esc(i.n[lang]||i.n.ar||i.n.fr||i.n.en||"")+'</span><b>× '+i.q+'</b></div>'}).join("")+'</div>';
    h+='<div style="opacity:.7;font-size:12px;margin-top:6px">'+new Date(o.u||o.t).toLocaleString(lang=="ar"?"ar-MA-u-nu-latn":lang,{dateStyle:"short",timeStyle:"short"})+'</div>';
    h+='<button type="button" class="btn2" id="tkb" style="width:100%;margin-top:10px">←</button>';view(frame(h))}).catch(function(){form(Y("err"),c)})}
window.tkOpen=function(c){document.getElementById("tkov").classList.add("open");if(c)look(c);else form("","")};
window.tkDone=function(c){document.getElementById("tkov").classList.add("open");view('<h3 style="text-align:center">'+Y("oc")+'</h3><div class="lbl" style="text-align:center">'+Y("ocs")+'</div><div style="text-align:center;font-size:30px;font-weight:800;letter-spacing:3px;color:#fbbf24;margin:10px 0;direction:ltr">'+c+'</div><button type="button" class="btn2" id="tkcp" data-c="'+c+'" style="width:100%">'+Y("cp")+'</button><button type="button" class="send" id="tkt" data-c="'+c+'" style="width:100%;margin-top:8px;background:var(--g)">'+Y("tr")+'</button><button type="button" class="btn2" id="tkx" style="width:100%;margin-top:8px">'+Y("close")+'</button>')};
ov.addEventListener("click",function(e){var t=e.target;if(t==ov||t.id=="tkx"){ov.classList.remove("open");return}
  if(t.id=="tkg")look(document.getElementById("tki").value);else if(t.id=="tkb")form("","");else if(t.id=="tkt")look(t.dataset.c);else if(t.dataset&&t.dataset.c&&t.className=="tkch")look(t.dataset.c);
  else if(t.id=="tkcp"){var c=t.dataset.c;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).catch(function(){}).then(function(){t.textContent=Y("ncp")})}});
var l=document.getElementById("trl");if(l){l.textContent=Y("lnk");l.onclick=function(){tkOpen()}}
var l2=document.getElementById("trcart");if(l2){l2.textContent=Y("lnk");l2.onclick=function(){document.getElementById("ov").classList.remove("open");tkOpen()}}
document.getElementById("lang").addEventListener("click",function(){setTimeout(function(){if(l)l.textContent=Y("lnk");if(l2)l2.textContent=Y("lnk")},50)});
})();
</script>

document.getElementById("lbc").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;e.stopPropagation();
  if(b.dataset.la){var id=b.dataset.la;cart[id]=(cart[id]||0)+1;renderCart();b.textContent=T("added");setTimeout(function(){b.textContent=T("add")},900)}
  else if(b.dataset.lbuy){var id=b.dataset.lbuy;cart[id]=Math.max(cart[id]||0,1);renderCart();document.getElementById("lbx").click();$("ov").classList.add("open");setTimeout(function(){try{$("name").focus()}catch(x){}},300)}});
</script></body>
